<!doctype html>
<html lang="id" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PromptLab Studios — Wadah Produk Digital</title>
    <meta
      name="description"
      content="PromptLab Studios membangun dan merawat produk digital sendiri. Dua produk sudah hidup: SwiftLink — satu API key untuk 13 model AI — dan Muse Topup, layanan isi token Muse."
    />
    <meta name="theme-color" content="#fafafa" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="preload" href="/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      /* Paint the correct background before the stylesheet bundle arrives. */
      html { background: #fafafa; }
      html[data-theme="dark"] { background: #08080a; }
    </style>
    <script>
      // Set theme and language before first paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var root = document.documentElement;
          var stored = localStorage.getItem("promptlab-theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          root.setAttribute("data-theme", theme);
          root.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute("content", theme === "dark" ? "#08080a" : "#fafafa");
          }
          var lang = localStorage.getItem("promptlab-lang");
          if (lang === "id" || lang === "en") root.lang = lang;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
