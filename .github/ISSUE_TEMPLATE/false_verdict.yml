name: Verdict fact report
description: Collect technical facts about a verdict you believe is wrong
labels: ["verdict-review"]
body:
  - type: markdown
    attributes:
      value: |
        Verdict **disputes** are handled by the dispute process linked from
        the result page — this form only collects technical facts for the
        maintainers and does not itself open a dispute. **Never paste a
        real API key** here.
  - type: input
    id: run_id
    attributes:
      label: Run ID or result URL
      placeholder: "https://genomeprobe.cloud/r/…"
    validations:
      required: true
  - type: input
    id: endpoint
    attributes:
      label: Endpoint (base URL only, no key)
    validations:
      required: true
  - type: input
    id: claimed
    attributes:
      label: Claimed model vs detected result
      placeholder: "Claimed: … / Detected: …"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Technical evidence
      description: Response samples, headers, or measurements that support re-examination (keys redacted).
    validations:
      required: true
