name: Bug report
description: Something in the engine, web app, or worker behaves incorrectly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Never paste a real API key** anywhere in
        this form — use `sk-REPLACE_ME` in examples.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - engine (detectors / verdicts)
        - web (site / API / MCP)
        - worker (probe runner)
        - docs / repo
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the run ID or result URL if the bug concerns a probe result.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Steps, commands, or example requests (keys replaced with sk-REPLACE_ME).
